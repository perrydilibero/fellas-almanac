<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="UMASS 14' Fellas fantasy football league history, 2015 to today.">
<title>Fellas League Almanac</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: almanac record book. Sticky section tabs, stacked panels, tables with a pinned owner column.
   Color: maroon = identity, gold = titles/#1s, green/red = better/worse than normal. */
:root{
  --bg:#eef0ed; --panel:#ffffff; --panel-2:#f7f8f6; --ink:#16191c; --muted:#565c63; --rule:#dcdfdb; --rule-2:#c9cdc8;
  --maroon:#7a1f2b; --maroon-soft:#f5e4e6; --gold:#9a6c10; --gold-fill:#e9b949; --gold-soft:#f8eed8;
  --good:#2e7d4f; --bad:#b23a2e;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --panel:#1b1e22; --panel-2:#20242a; --ink:#eceeea; --muted:#a7adb3; --rule:#2e3237; --rule-2:#3b4046;
  --maroon:#e8808b; --maroon-soft:#3b2327; --gold:#e3b75a; --gold-fill:#b8892a; --gold-soft:#3a3020;
  --good:#6fcb98; --bad:#f08c7e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e22; --panel-2:#20242a; --ink:#eceeea; --muted:#a7adb3; --rule:#2e3237; --rule-2:#3b4046;
  --maroon:#e8808b; --maroon-soft:#3b2327; --gold:#e3b75a; --gold-fill:#b8892a; --gold-soft:#3a3020;
  --good:#6fcb98; --bad:#f08c7e; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead + tabs */
header.mast{background:var(--panel);border-top:4px solid var(--maroon)}
header.mast .wrap{padding-block:20px 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
.brand h1{font:800 clamp(32px,5.2vw,52px)/0.92 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase;color:var(--maroon);text-wrap:balance}
.brand p{margin:8px 0 0;color:var(--muted);font-size:14px}
.since{font:500 12.5px/1.6 var(--f-mono);color:var(--muted);text-align:right}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--rule-2);box-shadow:0 1px 0 var(--rule)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:13px 9px 10px;color:var(--muted);text-decoration:none;font:600 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--maroon);border-bottom-color:var(--maroon)}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}

/* type */
main .wrap{padding-block:28px 64px}
section.view{display:grid;gap:24px}
h2{font:800 clamp(30px,4.4vw,40px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.015em;margin:0;text-wrap:balance}
h3{font:800 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;color:var(--ink)}
.h3sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.panel-head{margin-bottom:14px}
.lede{color:var(--muted);max-width:72ch;margin:8px 0 0;font-size:16px}
.note{font-size:13px;color:var(--muted);max-width:86ch;margin:12px 0 0}
.muted{color:var(--muted)}
b,strong{font-weight:700}

/* panels */
.block{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:20px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}

/* tables */
.tblwrap{overflow-x:auto;min-width:0;margin-inline:-4px;padding-inline:4px}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th{white-space:normal;min-width:44px;font:600 11.5px/1.25 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);vertical-align:bottom;border-bottom:2px solid var(--rule-2);background:var(--panel)}
th.l,td.l{text-align:left}
th.l:first-child{min-width:0}
th.c,td.c{text-align:center}
td.num{font-family:var(--f-mono);font-size:13.5px}
td.wrapc{white-space:normal}
tbody tr:last-child td{border-bottom:0}
.tblwrap table :is(td,th):first-child{position:sticky;left:0;z-index:1;background:var(--panel);box-shadow:1px 0 0 var(--rule)}
tr.me td{background:var(--maroon-soft)}
.tblwrap tr.me td:first-child{background:var(--maroon-soft)}
tr.me td:first-child{box-shadow:inset 4px 0 0 var(--maroon),1px 0 0 var(--rule)}
.owner-link.me{font-weight:700;color:var(--maroon)}
tbody tr:hover td{background-image:linear-gradient(rgba(127,127,127,.07),rgba(127,127,127,.07))}
tr.grp td{border-top:2px solid var(--rule-2)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sort[data-dir="asc"]::after{content:" ▲";font-size:9px}
th.sort[data-dir="desc"]::after{content:" ▼";font-size:9px}
.owner-link{text-decoration:none;border-bottom:1px dotted var(--rule-2)}
.owner-link:hover{color:var(--maroon);border-bottom-color:var(--maroon)}
.sn{display:none}
@media (max-width:700px){table .fn{display:none} table .sn{display:inline}}
table.short .fn{display:none} table.short .sn{display:inline}

/* bits */
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font:700 11.5px/1.6 var(--f-body);letter-spacing:.03em}
.chip.gold{background:var(--gold-fill);color:#2a1d00}
.chip.m{background:var(--maroon-soft);color:var(--maroon)}
.chip.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.b{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.n{background:var(--panel-2);color:var(--muted);border:1px solid var(--rule)}
.pos{display:inline-block;min-width:36px;text-align:center;font:600 11.5px/1.5 var(--f-mono);border:1px solid var(--rule-2);border-radius:4px;padding:0 5px;color:var(--ink);background:var(--panel-2)}
.up{color:var(--good);font-weight:600}.dn{color:var(--bad);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--rule)}

/* champions */
.timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.yr{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--panel);display:grid;gap:2px}
.yr b{font:800 26px/1 var(--f-display);color:var(--gold)}
.yr .who{font-weight:700;font-size:15px}
.yr .ru{font-size:12.5px;color:var(--muted)}
.yr.mine{border-color:var(--maroon);box-shadow:inset 0 0 0 1px var(--maroon)}

/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.fact{background:var(--panel-2);border:1px solid var(--rule);border-left:4px solid var(--gold-fill);border-radius:6px;padding:12px 14px}
.fact .big{font:800 34px/1 var(--f-display);color:var(--ink)}
.fact .cap{color:var(--muted);font-size:14px;margin-top:4px}
.fact.me{border-left-color:var(--maroon)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{background:transparent;color:var(--muted);border:0;padding:9px 14px;font:600 13px var(--f-body);cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--maroon);color:#fff}
select{font:600 15px var(--f-body);padding:9px 12px;border-radius:8px;border:1px solid var(--rule-2);background:var(--panel);color:var(--ink)}

/* owner */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.tile{background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;padding:12px}
.tile .v{font:800 28px/1 var(--f-display)}
.tile .k{font:600 11.5px/1.3 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ocard{display:grid;gap:8px;text-decoration:none;color:inherit}
.ocard:hover{border-color:var(--maroon)}
.ocard .n{font:800 23px/1 var(--f-display);text-transform:uppercase}
.ocard .meta{font-size:13.5px;color:var(--muted)}
.strip{display:flex;gap:3px}
.strip span{flex:1;min-width:0;height:24px;border-radius:3px;font:600 11px/24px var(--f-mono);text-align:center;color:var(--ink)}
.kv td{white-space:normal}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.kcard{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--panel)}
.kcard table td{padding:6px 4px;font-size:14px}
.kcard table td:first-child{white-space:normal}
.kcard tr.me td{background:var(--maroon-soft)}
.kv td.num{white-space:nowrap}

/* matrix + bars */
.matrix td{text-align:center;font-family:var(--f-mono);font-size:13px;padding:7px 6px}
.matrix td.l{text-align:left}
.matrix td.self{background:var(--panel-2);color:var(--muted)}
.matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:128px;padding:8px 4px;white-space:nowrap}
.barcell{min-width:150px}
@media (max-width:700px){.barcell{min-width:96px}}
.bar{position:relative;height:16px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.bar>span{position:absolute;inset:0 auto 0 0;border-radius:3px}
.dbar{position:relative;height:14px;min-width:120px}
.dbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--rule-2)}
.dbar>span{position:absolute;top:0;bottom:0;border-radius:2px}
.lwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.lwc{border:1px solid var(--rule);border-radius:8px;padding:14px;background:var(--panel);display:grid;gap:4px;align-content:start}
.lwc .y{font:800 22px/1 var(--f-display);color:var(--gold)}
.lwc .p{font:700 17px/1.2 var(--f-body)}
.lwc .m{font-size:13px;color:var(--muted)}
.lwc .w{font:800 30px/1 var(--f-display);margin-top:6px}
.lwc .w small{font:600 12px var(--f-body);letter-spacing:.05em;color:var(--muted);margin-left:4px}
.lwc .o{font-size:13.5px;margin-top:6px;padding-top:8px;border-top:1px solid var(--rule)}
.lwc.live{border-style:dashed}
.warbar{display:inline-block;height:8px;border-radius:2px;background:var(--gold-fill);vertical-align:middle;margin-right:8px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
@media (max-width:700px){
  body{font-size:15px}
  th,td{padding:7px 8px}
  .block{padding:15px;border-radius:7px}
  .since{text-align:left}
  .matrix th.rot{height:118px;font-size:11px}
  .facts{grid-template-columns:1fr 1fr;gap:10px}
  .fact{padding:10px 11px}
  .fact .big{font-size:26px}
  .fact .cap{font-size:13px}
  .seg{flex-wrap:nowrap}
  .lwgrid{grid-template-columns:1fr 1fr;gap:8px}
  .lwc{padding:10px}
  .lwc .p{font-size:14.5px}
  .lwc .w{font-size:24px}
  .lwc .m,.lwc .o{font-size:12px}
  .seg button{padding:8px 10px;font-size:12.5px}
}
/* v2 additions */
.sub{display:grid;gap:24px;scroll-margin-top:64px}
.sub + .sub{margin-top:28px;padding-top:28px;border-top:2px solid var(--rule-2)}
h2.sub-h2{font-size:clamp(26px,3.6vw,32px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:600 13px var(--f-body);padding:8px 14px;border-radius:999px;border:1px solid var(--rule-2);background:var(--panel);color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--maroon);color:var(--maroon)}
.morebtn{display:block;margin:14px auto 0;font:600 13px var(--f-body);padding:9px 18px;border-radius:999px;border:1px solid var(--rule-2);background:var(--panel-2);color:var(--ink);cursor:pointer}
.morebtn:hover{border-color:var(--maroon);color:var(--maroon)}
.mobile-only{display:none}
@media (max-width:700px){.mobile-only{display:block}.lim>*:nth-child(n+7){display:none}}
.lim6>*:nth-child(n+7){display:none}
.blurb{border-left:4px solid var(--maroon);background:var(--panel);border-radius:0 8px 8px 0;padding:14px 18px;border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.blurb .lbl{font:700 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--maroon);margin-bottom:4px}
.blurb p{margin:0;font-size:16px}
.ocard .blurb-s{font-size:13.5px;color:var(--ink);border-top:1px solid var(--rule);padding-top:8px}
.oswitch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.oswitch .nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.oswitch select{max-width:100%;min-width:0}
@media (max-width:700px){.oswitch select{max-width:38vw;font-size:14px}}
.oswitch a.btn{font:600 13px var(--f-body);padding:8px 12px;border-radius:8px;border:1px solid var(--rule-2);background:var(--panel);text-decoration:none}
.strip-y{display:flex;gap:3px;margin-top:3px}
.strip-y span{flex:1;min-width:0;text-align:center;font:500 10px var(--f-mono);color:var(--muted)}
.ph td{text-align:center;padding:6px 4px}
.ph .d{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;line-height:18px;font-size:11px}
.ph .d.t{background:var(--gold-fill);color:#2a1d00;font-weight:800}
.ph .d.r{background:transparent;border:3px solid var(--gold-fill);width:16px;height:16px}
.ph .d.p{background:var(--good);width:10px;height:10px;opacity:.85}
.ph .d.m{background:var(--rule-2);width:6px;height:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:500 11px var(--f-mono);fill:var(--muted)}
.chart .lbl{font:600 11px var(--f-body);fill:var(--muted)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .axis{stroke:var(--rule-2);stroke-width:1}
.chart .ln{fill:none;stroke:var(--maroon);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .band{fill:color-mix(in srgb,var(--maroon) 12%,transparent)}
.chart .zone{fill:color-mix(in srgb,var(--good) 9%,transparent)}
.chart .pt{fill:var(--maroon);stroke:var(--panel);stroke-width:2}
.chart .pt.gold{fill:var(--gold-fill)}
.chart .hit{fill:transparent}
.chart .hit:hover + .pt, .chart .pt:hover{stroke:var(--ink)}
.cell-link{color:inherit;text-decoration:none;display:block}
.cell-link:hover{text-decoration:underline}
.board td{padding:4px;vertical-align:top;white-space:normal;text-align:left;border-bottom:0}
.board th{text-align:left;white-space:normal;min-width:96px}
.board .pk{border-radius:5px;padding:5px 6px;min-width:96px;min-height:44px;font-size:12.5px;line-height:1.25;border:1px solid var(--rule)}
.board .pk b{display:block;font-weight:600;font-size:12.5px}
.board .pk small{font:600 10.5px var(--f-mono);color:var(--muted)}
.board .pk.t1{background:var(--gold-fill);color:#2a1d00;border-color:transparent}
.board .pk.t1 small{color:#2a1d00}
.board .pk.t2{background:color-mix(in srgb,var(--good) 26%,var(--panel))}
.board .pk.t3{background:var(--panel-2)}
.board .pk.t4{background:color-mix(in srgb,var(--bad) 18%,var(--panel))}
.board .kp{font:800 9.5px var(--f-body);background:var(--maroon);color:#fff;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.board th:first-child,.board td.rd{width:38px;min-width:38px!important;padding-inline:4px}
.board td.rd{font:700 12px var(--f-mono);color:var(--muted);vertical-align:middle;text-align:center}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.vs .side .n{font:800 24px/1.1 var(--f-display);text-transform:uppercase}
.vs .big{font:800 46px/1 var(--f-display)}
.vs .mid{font:600 13px var(--f-body);color:var(--muted)}
@media (max-width:700px){
  body:not([data-view="home"]) .brand p, body:not([data-view="home"]) .since{display:none}
  header.mast .wrap{padding-block:14px 10px}
  .brand h1{font-size:28px}
  .vs .big{font-size:36px}.vs .side .n{font-size:18px}
}

</style>
</head>
<body>


<header class="mast"><div class="wrap">
  <div class="brand"><h1>UMASS 14' Fellas Almanac</h1><p>Every season, every matchup, every draft slot and every top scorer, pulled from the ESPN league.</p></div>
  <div class="since" id="since"></div>
</div></header>

<script>
(()=>{
const E=JSON.parse(document.getElementById('data').textContent);
/* Owner names exactly as entered on ESPN. Mike Stone's franchise is co-owned by Kevin Haworth from 2026. */
const NAME=n=>({'Mike Stone':'Mike Stone / Kevin Haworth'})[n]||n;
const O=E.O.map(NAME), N=O.length, ME=-1; /* no owner is singled out: the audience is the whole league */
/* short form where space is tight = ESPN last name (first names repeat: Mike, Mike, Michael) */
const NK=O.map(n=>n.startsWith('Mike Stone')?'Stone / Haworth':n.split(' ').pop());
const YEARS=Object.keys(E.S).map(Number).sort((a,b)=>a-b);
const DONE=YEARS.filter(y=>y<2026), CUR=2026;
const POS=['QB','RB','WR','TE','DST'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?(100*a/b):0;
const f1=x=>(Math.round(x*10)/10).toFixed(1);
const cl=x=>Math.round(x*10)===0?'muted':x>0?'up':'dn';
const sg=x=>{const v=Math.round(x*10)/10; return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)};
const fmt=x=>Number(x).toLocaleString('en-US');
const sf=v=>{const t=(+v).toFixed(2); return t.endsWith('0')?(+v).toFixed(1):t};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const first=i=>O[i];
const ordn=n=>n+((n%100>10&&n%100<14)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'));
const nm=i=>`<span class="fn">${esc(O[i])}</span><span class="sn">${esc(NK[i])}</span>`;
const olink=i=>i<0?'<span class="muted">Undrafted</span>':`<a class="owner-link${i===ME?' me':''}" href="#owner-${i}">${nm(i)}</a>`;
const rec=(w,l,t)=>`${w}-${l}${t?'-'+t:''}`;
const row=(r,y)=>E.S[y].find(x=>x[0]===r);
const champ={}, runner={}; DONE.forEach(y=>{E.S[y].forEach(r=>{if(r[6]===1) champ[y]=r[0]; if(r[6]===2) runner[y]=r[0];});});
const titles=O.map((_,i)=>DONE.filter(y=>champ[y]===i));
const C=E.C.map(c=>({w:c[0],l:c[1],t:c[2],pf:c[3],pa:c[4],apw:c[5],apl:c[6],apt:c[7],po:c[8],pow:c[9],pol:c[10],ti:c[11],ru:c[12],pf1:c[13],last:c[14],best:c[15],seasons:c[16],xw:c[17]}));
$('#since').innerHTML=`${DONE[0]}–${CUR} · ${DONE.length} complete seasons<br>${CUR} through Week 7`;

/* color helpers: green/red = better/worse, gold = counts of good things */
const mix=(v,a)=>`background:color-mix(in srgb,var(${v}) ${Math.round(a)}%,var(--panel))`;
const div=(v,mid,span,hb=true)=>{let d=(v-mid)/span; if(!hb) d=-d; d=Math.max(-1,Math.min(1,d)); if(Math.abs(d)<0.06) return ''; return `style="${mix(d>0?'--good':'--bad',6+Math.abs(d)*34)}"`};
const seq=(v,max)=>v>0&&max?`style="${mix('--gold-fill',12+Math.min(1,v/max)*58)}"`:'';
const finStyle=(f)=>f===1?`style="background:var(--gold-fill);color:#2a1d00;font-weight:700"`:div(f,6.5,5.5,false);
const sortable=(tbl)=>{tbl.querySelectorAll('th.sort').forEach(th=>{th.tabIndex=0; const go=()=>{const idx=[...th.parentNode.children].indexOf(th); const body=tbl.tBodies[0]; const rows=[...body.rows]; const dir=th.dataset.dir==='desc'?'asc':'desc'; th.parentNode.querySelectorAll('th').forEach(x=>delete x.dataset.dir); th.dataset.dir=dir; rows.sort((a,b)=>{const x=a.cells[idx].dataset.v??a.cells[idx].textContent, y=b.cells[idx].dataset.v??b.cells[idx].textContent; const nx=parseFloat(x), ny=parseFloat(y); const r=(!isNaN(nx)&&!isNaN(ny))?nx-ny:String(x).localeCompare(String(y)); return dir==='asc'?r:-r}); rows.forEach(r=>body.appendChild(r));}; th.addEventListener('click',go); th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});};
const head=(t,sub)=>`<div class="panel-head"><h3>${t}</h3>${sub?`<p class="h3sub">${sub}</p>`:''}</div>`;
const legendFin=`<div class="legend"><span><i style="background:var(--gold-fill)"></i>Champion / #1</span><span><i style="${mix('--good',38)}"></i>Better than average</span><span><i style="${mix('--bad',38)}"></i>Worse than average</span></div>`;

const VIEWS=[['home','League'],['owners','Owners'],['h2h','Head-to-Head'],['seasons','Seasons'],['slots','Draft Slots'],['draft','Draft Grades'],['positions','Top Scorers'],['winners','League Winners'],['trades','Trades'],['management','Lineups'],['records','Records'],['about','About']];
$('#tabs').innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" data-k="${k}">${l}</a>`).join('');

/* ---------- derived ---------- */
const credit=(i,pos,mode,tier)=>{const v=E.CR[i][POS.indexOf(pos)]; const t={'1':0,'3':1,'12':2}[tier]; if(mode==='R') return v[6+t]; if(mode==='D') return v[t]; return v[t]+v[3+t];};
const effOf=i=>{const a=E.EF[i].reduce((s,x)=>s+x[0],0), o=E.EF[i].reduce((s,x)=>s+x[1],0); return {a,o,p:pct(a,o),lost:o-a}};
const aqOf=i=>E.AQ[i].reduce((s,x)=>s+x,0);
// draft slots (from the league workbook) vs regular-season finish (ESPN seed)
const slot=(y,i)=>E.DS[y]?E.DS[y][i]:null;
const seed=(y,i)=>row(i,y)[7];
const SR=[]; DONE.forEach(y=>O.forEach((_,i)=>SR.push({y,i,s:slot(y,i),f:seed(y,i),fin:row(i,y)[6]})));
const SLOT=[...Array(12)].map((_,k)=>{const rs=SR.filter(r=>r.s===k+1); return {s:k+1,n:rs.length,avg:mean(rs.map(r=>r.f)),best:Math.min(...rs.map(r=>r.f)),worst:Math.max(...rs.map(r=>r.f)),po:rs.filter(r=>r.f<=6).length,ti:rs.filter(r=>r.fin===1).length,ti_who:rs.filter(r=>r.fin===1)}});
const expF=s=>SLOT[s-1].avg;
const OD=O.map((_,i)=>{const mine=SR.filter(r=>r.i===i); const all=YEARS.map(y=>slot(y,i)).filter(x=>x!=null); const pm=mine.map(r=>expF(r.s)-r.f);
  return {avgSlot:mean(all),ones:all.filter(s=>s===1).length,twelves:all.filter(s=>s===12).length,avgFin:mean(mine.map(r=>r.f)),pm:mean(pm),beat:pm.filter(x=>x>0).length,miss:pm.filter(x=>x<0).length,
    odd:mine.filter(r=>r.f===7).length,lastp:mine.filter(r=>r.f===12).length,seed1:mine.filter(r=>r.f===1).length}});

/* ---------- views ---------- */
function home(){
  const order=O.map((_,i)=>i).sort((a,b)=>titles[b].length-titles[a].length||(C[b].w/(C[b].w+C[b].l))-(C[a].w/(C[a].w+C[a].l)));

function slots(){

   </tbody></table></div><p class="note">Average slot includes ${CUR}. Finish and +/- use complete seasons only. Beat / missed = seasons finishing better / worse than the slot's expected finish.</p></div>

  const sel=`<select id="lwSel" aria-label="Season">${yrsDesc.map(x=>`<option value="${x}" ${x==y?'selected':''}>${x}${x==CUR?' (in progress)':''}</option>`).join('')}</select>`;
  return `<section class="view"><div><h2>League Winners</h2><p class="lede">The players who won people the league, measured in this league's own scoring. <b>WAR</b> (wins above replacement) is how many extra games a player was worth over a replacement-level starter at his position, so a QB, a running back and a defense can be compared on one scale. How it's calculated is at the bottom of the page.</p></div>
   <div><h3 style="margin-bottom:6px">The league winner, every season</h3><p class="h3sub" style="margin:0 0 14px">The single most valuable player each year by WAR, and who had him.</p><div class="lwgrid ${OPEN.has('lwc')?'':'lim'}">${yrsDesc.map(card).join('')}</div>${moreBtn('lwc',yrsDesc.length,6,'Show all seasons',true)}</div>
   <div><h3 style="margin-bottom:6px">The golden waiver pickup, every season</h3><p class="h3sub" style="margin:0 0 14px">The best skill-position (RB, WR or TE) free-agent add each year: points he scored in the lineup of the team that picked him up. QBs, defenses and kickers are left out.${' '}Before 2018 ESPN only kept end-of-season rosters, so those years show the best undrafted player who finished the season on a roster.</p><div class="lwgrid ${OPEN.has('gpc')?'':'lim'}">${yrsDesc.map(pcard).join('')}</div>${moreBtn('gpc',yrsDesc.length,6,'Show all seasons',true)}</div>
   <div class="block"><div class="controls" style="margin-bottom:6px"><h3>Season detail</h3>${sel}</div><p class="h3sub" style="margin:0 0 14px">${y==CUR?'Season to date. ':''}Replacement level in ${y}: ${Object.entries(o.rep).map(([p,v])=>`${PL[p]} ${sf(v)}`).join(' · ')} points.</p>
    <h3 style="font-size:17px;margin:4px 0 10px">Most valuable players</h3>
    <div class="tblwrap"><table class="short"><thead><tr><th class="l">#</th><th class="l">Player</th><th>Pos</th><th class="l">NFL</th><th>Points</th><th>Over repl.</th><th>% over</th><th class="l">WAR</th><th class="l">Owner</th><th class="l">How acquired</th></tr></thead><tbody>${o.mvp.map(wRow).join('')}</tbody></table></div>
    <h3 style="font-size:17px;margin:22px 0 10px">Best at each position</h3>
    <div class="tblwrap"><table class="short"><thead><tr><th class="l">Pos</th><th class="l">Player</th><th>Points</th><th>Replacement</th><th>Over repl.</th><th>% over</th><th>WAR</th><th class="l">Owner</th></tr></thead><tbody>${posBest.map(r=>`<tr><td class="l"><span class="pos">${PL[r[1]]}</span></td><td class="l"><b>${esc(r[0])}</b> <span class="muted">${r[2]}</span></td><td class="num">${sf(r[3])}</td><td class="num">${sf(o.rep[r[1]])}</td><td class="num">+${f1(r[4])}</td><td class="num">+${r[6]}%</td><td class="num"><b>${r[5].toFixed(2)}</b></td><td class="l">${r[7]>=0?olink(r[7]):'–'}</td></tr>`).join('')}</tbody></table></div>

    </div>
   </div>
   <div class="grid2">
    <div class="block">${head('Best player seasons ever','Top 15 by WAR, '+DONE[0]+'–'+DONE.at(-1)+'.')}<div class="tblwrap"><table class="short"><thead><tr><th class="l">Player</th><th>Year</th><th>Pos</th><th class="l">WAR</th><th class="l">Owner</th></tr></thead><tbody>${top.map(r=>`<tr><td class="l"><b>${esc(r[1])}</b></td><td class="num">${r[0]}</td><td><span class="pos">${PL[r[2]]}</span></td><td class="l num"><span class="warbar" style="width:${(r[6]/maxW*60).toFixed(0)}px"></span><b>${r[6].toFixed(2)}</b></td><td class="l">${r[8]>=0?olink(r[8]):'–'}</td></tr>`).join('')}</tbody></table></div></div>

   </div>
   <div class="block" style="max-width:86ch">${head('How it\'s calculated')}<ul style="margin:0;padding-left:20px;display:grid;gap:8px">
    <li><b>Points</b> are each player's full NFL season in this league's scoring that year (standard in 2015, half-PPR after).</li>
    <li><b>Replacement level</b> is what the best player who wouldn't start for any of the 12 teams scored: the 13th QB, TE, D/ST and kicker, and the RBs and WRs just outside the 24 starters at each, after the 12 flex spots go to the next-best RB, WR or TE. Kickers count through 2020, when the league dropped them.</li>
    <li><b>Over replacement</b> = points minus replacement level. <b>% over</b> = how much better than replacement in percentage terms. QBs score a lot, so their % over looks small even when they're dominant; WAR fixes that.</li>
    <li><b>WAR</b> turns points over replacement into wins: points over replacement × 0.282 ÷ the standard deviation of weekly team scores that season (${f1(Math.min(...DONE.map(y=>LW[y].sd)))}–${f1(Math.max(...DONE.map(y=>LW[y].sd)))} points here). It's the standard estimate of how many extra matchups those points swing over a season.</li>
    <li><b>Owner</b> = the team that rostered the player for the most weeks (2018 on), or the team holding him at the end of the season (before 2018, when ESPN didn't keep weekly rosters).</li>
    <li><b>Waiver pickup</b> = joined a roster without being drafted or kept by that team and not as part of a trade. <b>Pts in lineup</b> counts only weeks he was started by that owner.</li>
   </ul></div>
  </section>`;

let trOwner=-1;
function trades(){
  const H='font-size:17px;margin:0 0 10px';
  const T=[]; Object.keys(E.TR).map(Number).sort((a,b)=>b-a).forEach(y=>E.TR[y].forEach(t=>{const pa=t[4].reduce((q,p)=>q+p[2],0), pb=t[3].reduce((q,p)=>q+p[2],0); T.push({y,w:t[0],a:t[1],b:t[2],ga:t[4],gb:t[3],pa,pb,m:Math.abs(pa-pb),win:Math.abs(pa-pb)<15?-1:(pa>pb?t[1]:t[2])})}));
  const done=T.filter(t=>t.y<CUR);
  const acq=T.flatMap(t=>[...t.gb.map(p=>({p,y:t.y,to:t.b,from:t.a,w:t.w})),...t.ga.map(p=>({p,y:t.y,to:t.a,from:t.b,w:t.w}))]);
  const best=[...acq].sort((a,b)=>b.p[2]-a.p[2]).slice(0,10);
  const worst=acq.filter(a=>a.p[5]>=3&&a.p[4]>=8&&a.p[6]>0).map(a=>({...a,short:a.p[4]*a.p[6]-a.p[3]})).filter(a=>a.short>5).sort((a,b)=>b.short-a.short).slice(0,10);
  const lop=[...T].sort((a,b)=>b.m-a.m).slice(0,10);
  const rec=O.map(()=>({n:0,w:0,l:0,e:0,net:0,partners:{}}));
  T.forEach(t=>{[[t.a,t.pa,t.pb,t.b],[t.b,t.pb,t.pa,t.a]].forEach(([o,got,gave,pt])=>{const r=rec[o]; r.n++; r.net+=got-gave; r.partners[pt]=(r.partners[pt]||0)+1; if(t.win===-1) r.e++; else if(t.win===o) r.w++; else r.l++;});});

  const pairs={}; T.forEach(t=>{const k=[t.a,t.b].sort((x,z)=>x-z).join('-'); pairs[k]=(pairs[k]||0)+1}); const topPairs=Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const maxY=Math.max(...byYear.map(x=>x[1]));
  const pl=list=>list.map(p=>`${esc(p[0])} <span class="muted" style="font-size:12px">${PL[p[1]]||p[1]}</span>${injTag(p)}`).join(', ');

  const most=(f)=>{const m=Math.max(...O.map((_,i)=>f(i))); return [m,O.map((_,i)=>i).filter(i=>f(i)===m)]};
  const busiest=most(i=>rec[i].n), bestNet=most(i=>rec[i].net), worstNet=most(i=>-rec[i].net);
  const tile=(v,k)=>`<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  const logRows=(list)=>{let lastY=null; return list.map(t=>{const grp=t.y!==lastY; lastY=t.y; return `<tr class="${grp?'grp':''}"><td class="l num"><b>${t.y}</b> · ${wk(t)}</td><td class="l">${olink(t.a)}</td><td class="l wrapc" style="min-width:170px">${pl(t.ga)}</td><td class="num ${t.win===t.a?'up':''}"><b>${sf(t.pa)}</b></td><td class="l">${olink(t.b)}</td><td class="l wrapc" style="min-width:170px">${pl(t.gb)}</td><td class="num ${t.win===t.b?'up':''}"><b>${sf(t.pb)}</b></td><td class="l">${t.win<0?'<span class="muted">about even</span>':olink(t.win)+' <span class="muted">+'+f1(t.m)+'</span>'}${injLoss(t)?'<br><span class="muted" style="font-size:12px">losing side hit by injury</span>':''}</td></tr>`}).join('')};
  return `<section class="view"><div><h2>Trades</h2><p class="lede">Every trade since 2018, who won it and by how much. A trade is scored by what each owner's new players went on to score in that owner's starting lineup for the rest of the season. Within 15 points counts as about even. A red "missed 6 of 15" tag means that player sat out that many of his games for the new team after the trade (injured, suspended or inactive), so the trade may look worse than the decision was.</p></div>
   <div class="block"><div class="tiles">
    ${tile(T.length,'Trades since 2018')}${tile(f1(done.length/Object.keys(E.TR).filter(y=>+y<CUR).length),'Trades per season')}
    ${tile(`<span style="font-size:22px">${busiest[1].map(i=>esc(NK[i])).join(' & ')}</span>`,`Most trades (${busiest[0]})`)}
    ${tile(`<span style="font-size:22px">${bestNet[1].map(i=>esc(NK[i])).join(' & ')}</span>`,`Most points gained (+${fmt(Math.round(bestNet[0]))})`)}
    ${tile(`<span style="font-size:22px">${worstNet[1].map(i=>esc(NK[i])).join(' & ')}</span>`,`Most points given away (−${fmt(Math.round(worstNet[0]))})`)}
    ${tile(`<span style="font-size:22px">${topPairs[0][0].split('-').map(i=>esc(NK[+i])).join(' & ')}</span>`,`Most frequent partners (${topPairs[0][1]} trades)`)}
   </div></div>
   <div class="grid2">
    <div class="block">${head('Trade records by owner','W-L-E = trades won, lost and about even. Net = points gained minus points given away, in starting lineups.')}<div class="tblwrap"><table id="tTr" class="short"><thead><tr><th class="l sort">Owner</th><th class="sort">Trades</th><th class="sort">W-L-E</th><th class="sort">Net pts</th><th class="l">Most traded with</th></tr></thead><tbody>${ord.map(i=>{const r=rec[i]; const tp=Object.entries(r.partners).sort((a,b)=>b[1]-a[1])[0]; return `<tr><td class="l">${olink(i)}</td><td class="num">${r.n||'–'}</td><td class="num" data-v="${r.w-r.l}">${r.n?r.w+'-'+r.l+'-'+r.e:'–'}</td><td class="num ${cl(r.net)}" data-v="${r.net}" ${r.n?div(r.net,0,250):''}><b>${r.n?(r.net>0?'+':r.net<0?'−':'')+fmt(Math.abs(Math.round(r.net))):'–'}</b></td><td class="l">${tp?olink(+tp[0])+' <span class="muted">('+tp[1]+')</span>':'<span class="muted">–</span>'}</td></tr>`}).join('')}</tbody></table></div></div>
    <div class="block">${head('Trades by season')}<div class="tblwrap"><table><tbody>${byYear.map(([y,n])=>`<tr><td class="l"><b>${y}</b>${y==CUR?' <span class="chip m">so far</span>':''}</td><td class="l" style="width:70%"><div class="bar"><span style="width:${(n/maxY*100).toFixed(0)}%;background:var(--gold-fill)"></span></div></td><td class="num"><b>${n}</b></td></tr>`).join('')}</tbody></table></div>
     <h3 style="${H};margin-top:22px">Most frequent trade partners</h3><div class="tblwrap"><table class="short"><tbody>${topPairs.map(([k,n])=>`<tr><td class="l">${k.split('-').map(i=>olink(+i)).join(' &amp; ')}</td><td class="num"><b>${n}</b> trades</td></tr>`).join('')}</tbody></table></div></div>
   </div>
   <div class="block">${head('Most lopsided trades','The biggest gaps between what each side got.')}<div class="tblwrap"><table class="short"><thead><tr><th class="l">When</th><th class="l">Won it</th><th class="l">Got</th><th>Pts</th><th class="l">Lost it</th><th class="l">Got</th><th>Pts</th><th>Margin</th></tr></thead><tbody>${lop.map(t=>{const aw=t.pa>=t.pb; return `<tr><td class="l num">${t.y} · ${wk(t)}</td><td class="l">${olink(aw?t.a:t.b)}</td><td class="l wrapc" style="min-width:160px">${pl(aw?t.ga:t.gb)}</td><td class="num up"><b>${sf(Math.max(t.pa,t.pb))}</b></td><td class="l">${olink(aw?t.b:t.a)}</td><td class="l wrapc" style="min-width:160px">${pl(aw?t.gb:t.ga)}</td><td class="num">${sf(Math.min(t.pa,t.pb))}</td><td class="num"><b>+${f1(t.m)}</b>${(aw?t.gb:t.ga).some(isInj)?'<br><span class="muted" style="font-size:11.5px">injury</span>':''}</td></tr>`}).join('')}</tbody></table></div></div>
   <div class="grid2">
    <div class="block">${head('Best trade acquisitions','Most points scored in the new owner\'s starting lineup after the deal.')}<div class="tblwrap"><table class="short"><thead><tr><th class="l">Player</th><th class="l">To</th><th class="l">From</th><th>Pts</th></tr></thead><tbody>${best.map(a=>`<tr><td class="l"><b>${esc(a.p[0])}</b><br><span class="muted" style="font-size:12px">${PL[a.p[1]]||a.p[1]} · ${a.y} · ${a.w===1?'preseason':'Wk '+a.w}</span>${isInj(a.p)?'<br>'+injTag(a.p):''}</td><td class="l">${olink(a.to)}</td><td class="l">${olink(a.from)}</td><td class="num"><b>${sf(a.p[2])}</b></td></tr>`).join('')}</tbody></table></div></div>
    <div class="block">${head('Worst trade acquisitions','Players scoring 8+ a week (over at least 3 weeks) before the trade who fell furthest short of that pace for their new team.')}<div class="tblwrap"><table class="short"><thead><tr><th class="l">Player</th><th class="l">To</th><th>Before</th><th>After</th><th>Shortfall</th></tr></thead><tbody>${worst.map(a=>`<tr><td class="l"><b>${esc(a.p[0])}</b><br><span class="muted" style="font-size:12px">${PL[a.p[1]]||a.p[1]} · ${a.y} · Wk ${a.w}</span>${isInj(a.p)?'<br>'+injTag(a.p):''}</td><td class="l">${olink(a.to)}</td><td class="num">${f1(a.p[4])}</td><td class="num">${f1(a.p[3]/a.p[6])}</td><td class="num dn"><b>−${f1(a.short)}</b></td></tr>`).join('')}</tbody></table></div><p class="note">Before / after = points per week before the trade and for the new team. Shortfall = pre-trade points per week × weeks on the new team − points actually scored there. Trades made before Week 1 have no "before" and aren't included. A red "missed" tag means the player sat out games for his new team (injured, suspended or inactive), which usually explains the shortfall.</p></div>

    <div class="tblwrap"><table class="short"><thead><tr><th class="l">When</th><th class="l">Owner</th><th class="l">Got</th><th>Pts</th><th class="l">Owner</th><th class="l">Got</th><th>Pts</th><th class="l">Edge</th></tr></thead><tbody>${logRows(OPEN.has('trlog')?shown:shown.slice(0,12))}</tbody></table></div>${moreBtn('trlog',shown.length,12,'Show all '+shown.length+' trades')}
    <p class="note">Pts = what each owner's new players scored in that owner's starting lineup for the rest of the season (${CUR} through Week 7). "Pre" = traded between the draft and Week 1. 2024 had no trades.</p></div>
   <div class="block" style="max-width:86ch">${head('How trades are found')}<p style="margin:0">ESPN keeps weekly rosters from 2018 on, so that's where this starts. A trade is two teams swapping players in both directions in the same week. One-way moves are treated as drops and waiver claims, not trades. Trades between the draft and Week 1 are found by comparing draft-day rosters with Week 1 rosters.</p></div>
  </section>`;
}
let pMode='R', pTier='1';
function positions(){
  const tot=i=>POS.reduce((s,p)=>s+credit(i,p,pMode,pTier),0);
  const order=O.map((_,i)=>i).sort((a,b)=>tot(b)-tot(a));
  const max=Math.max(1,...O.flatMap((_,i)=>POS.map(p=>credit(i,p,pMode,pTier))));
  const ones=DONE.slice().reverse().map(y=>`<tr><td class="l"><b>${y}</b></td>${POS.map(p=>{const r=E.P[y][p][0]; const who=pMode==='R'?r[5]:r[2]; return `<td class="l wrapc" style="min-width:140px"><b>${esc(r[0])}</b> <span class="muted" style="font-family:var(--f-mono);font-size:12.5px">${r[1]}</span><br><span class="${who===ME?'':'muted'}" style="font-size:13px;${who===ME?'color:var(--maroon);font-weight:700':''}">${who<0?'Undrafted':esc(O[who])}${pMode!=='R'&&r[4]?' (kept)':''}</span></td>`}).join('')}</tr>`).join('');
  const seg=(id,opts,cur)=>`<div class="seg" role="group" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`;
  const modeL={R:'rostered most weeks',D:'drafted',K:'drafted or kept'}[pMode], tierL={'1':'#1 overall','3':'top 3','12':'top 12'}[pTier];
  return `<section class="view"><div><h2>Top Scorers</h2><p class="lede">Each season every QB, RB, WR, TE and D/ST is ranked by total fantasy points in this league's scoring. This counts how often each owner had the top scorers, either by drafting them or by having them on the roster most of the season.</p></div>
   <div class="controls">${seg('pm',[['R','Rostered most weeks'],['D','Drafted'],['K','Drafted or kept']],pMode)}${seg('pt',[['1','#1 overall'],['3','Top 3'],['12','Top 12']],pTier)}</div>
   <div class="block">${head(`${tierL} finishes, ${modeL}`,`Complete seasons only (${DONE[0]}–${DONE.at(-1)}). Darker gold = more.`)}<div class="tblwrap"><table id="tPos"><thead><tr><th class="l sort">Owner</th>${POS.map(p=>`<th class="sort">${p}</th>`).join('')}<th class="sort">Total</th></tr></thead><tbody>
    ${order.map(i=>`<tr class="${i===ME?'me':''}"><td class="l">${olink(i)}</td>${POS.map(p=>{const v=credit(i,p,pMode,pTier); return `<td class="num" ${seq(v,max)}>${v||'<span class="muted">·</span>'}</td>`}).join('')}<td class="num"><b>${tot(i)}</b></td></tr>`).join('')}
   </tbody></table></div><p class="note">A player who finished #1 also counts toward top 3 and top 12.</p></div>
   <div class="block">${head(`The #1 scorer at each position, every year`,`Owner shown = ${pMode==='R'?'rostered him most weeks':'drafted him'}.`)}<div class="tblwrap"><table><thead><tr><th class="l">Year</th>${POS.map(p=>`<th class="l">${p}1</th>`).join('')}</tr></thead><tbody>${ones}</tbody></table></div></div>
  </section>`;
}
function draft(){

   </tbody></table></div><p class="note">Hit = a round 1–3 pick who finished top 12 at QB/TE or top 24 at RB/WR. Avg finish = the positional rank those picks finished at (lower is better). Steal = round 7+ pick who finished top 12 at RB/WR or top 5 at QB/TE. Bust = round 1–2 pick who finished outside the top 36 at RB/WR or top 18 at QB/TE.</p></div>

    <div class="kgrid">${kYears.map(y=>{const [flag,list]=E.K[y]; return `<div class="kcard"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font:800 20px var(--f-display)">${y}</b>${flag?'<span class="chip g">ESPN</span>':'<span class="chip m">inferred</span>'}</div><table><tbody>${list.map(k=>`<tr class="${k[1]===ME?'me':''}"><td class="l"><b>${esc(k[0])}</b></td><td class="l ${k[1]===ME?'':'muted'}">${esc(NK[k[1]])}</td><td class="num">R${k[2]}</td></tr>`).join('')}</tbody></table></div>`}).join('')}</div></div>
  </section>`;
}

  const sw=O.map((_,i)=>[E.SK[i][0],i,E.SK[i][1]]).sort((a,b)=>b[0]-a[0]).slice(0,5), sl=O.map((_,i)=>[E.SK[i][2],i,E.SK[i][3]]).sort((a,b)=>b[0]-a[0]).slice(0,5);
  const seasonPF=[]; YEARS.forEach(y=>{ if(y===CUR) return; E.S[y].forEach(r=>seasonPF.push([r[4],r[0],y,r[1],r[2]])) });

function ppgChart(){

function rivalry(a,b){
  if(a===b||!O[a]||!O[b]) return h2h();
  const gs=GAMES.filter(g=>(g.a===a&&g.b===b)||(g.a===b&&g.b===a)).map(g=>{const sa=g.a===a?g.pa:g.pb, sb=g.a===a?g.pb:g.pa; return {...g,sa,sb}}).sort((x,z)=>z.y-x.y||z.w-x.w);
  const wa=gs.filter(g=>g.win===a).length, wb=gs.filter(g=>g.win===b).length, tt=gs.filter(g=>g.win<0).length;
  const po=gs.filter(g=>g.po), pwa=po.filter(g=>g.win===a).length, pwb=po.filter(g=>g.win===b).length;
  const avgA=mean(gs.map(g=>g.sa)), avgB=mean(gs.map(g=>g.sb));
  const bigA=gs.filter(g=>g.win===a).sort((x,z)=>(z.sa-z.sb)-(x.sa-x.sb))[0], bigB=gs.filter(g=>g.win===b).sort((x,z)=>(z.sb-z.sa)-(x.sb-x.sa))[0];
  const close=[...gs].sort((x,z)=>Math.abs(x.sa-x.sb)-Math.abs(z.sa-z.sb))[0];
  let st=0, sw=-2; for(const g of gs){ if(sw===-2) sw=g.win; if(g.win===sw) st++; else break; }
  const lead=wa===wb?'All square':`${esc(NK[wa>wb?a:b])} leads`;
  const sel=(id,cur)=>`<select id="${id}" aria-label="Owner">${O.map((_,k)=>k).sort((x,z)=>O[x].localeCompare(O[z])).map(k=>`<option value="${k}" ${k===cur?'selected':''}>${esc(O[k])}</option>`).join('')}</select>`;
  const t=(v,k)=>`<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  const gl=g=>`${g.y} · Wk ${g.w}`;
  return `<section class="view">
   <div class="oswitch"><a href="#h2h" class="note" style="margin:0">← Head-to-head</a><div class="nav">${sel('rvA',a)}<span class="muted">vs</span>${sel('rvB',b)}</div></div>
   <div class="block"><div class="vs"><div class="side"><div class="n">${esc(O[a])}</div></div><div><div class="big">${wa}-${wb}${tt?'-'+tt:''}</div><div class="mid">${lead} · ${gs.length} games</div></div><div class="side"><div class="n">${esc(O[b])}</div></div></div></div>
   <div class="block"><div class="tiles">
    ${t(f1(avgA)+' – '+f1(avgB),'Average score')}${t(po.length?pwa+'-'+pwb:'–','Playoff meetings')}${t(st>1&&sw>=0?st+' · '+esc(NK[sw]):'–','Current streak')}
    ${t(bigA?'+'+f1(bigA.sa-bigA.sb):'–',`Biggest ${esc(NK[a])} win${bigA?' ('+gl(bigA)+')':''}`)}${t(bigB?'+'+f1(bigB.sb-bigB.sa):'–',`Biggest ${esc(NK[b])} win${bigB?' ('+gl(bigB)+')':''}`)}${t(close?f1(Math.abs(close.sa-close.sb)):'–',`Closest game${close?' ('+gl(close)+')':''}`)}
   </div></div>
   <div class="block">${head('Every game','Newest first. Regular season and championship-bracket playoffs.')}<div class="tblwrap"><table class="short"><thead><tr><th class="l">When</th><th class="l">Winner</th><th>${esc(NK[a])}</th><th>${esc(NK[b])}</th><th>Margin</th></tr></thead><tbody>
    ${gs.map(g=>`<tr class="${gs.indexOf(g)&&gs[gs.indexOf(g)-1].y!==g.y?'grp':''}"><td class="l num">${gl(g)}${g.po?' <span class="chip gold">PO</span>':''}</td><td class="l">${g.win>=0?olink(g.win):'<span class="muted">tie</span>'}</td><td class="num ${g.win===a?'up':''}"><b>${sf(g.sa)}</b></td><td class="num ${g.win===b?'up':''}"><b>${sf(g.sb)}</b></td><td class="num">${f1(Math.abs(g.sa-g.sb))}${g.sa===g.sb&&g.win>=0?' <span class="muted">(tiebreak)</span>':''}</td></tr>`).join('')}
   </tbody></table></div>${gs.some(g=>g.sa===g.sb&&g.win>=0)?'<p class="note">Tied playoff games went to the tiebreaker winner.</p>':''}</div>
  </section>`;
}

function weeklyHonors(){
  const yrs=YEARS; const hi={}, lo={};
  yrs.forEach(y=>{hi[y]=Array(12).fill(0); lo[y]=Array(12).fill(0); const wk={}; GAMES.filter(g=>g.y===y&&!g.po).forEach(g=>{(wk[g.w]=wk[g.w]||[]).push([g.a,g.pa],[g.b,g.pb])}); Object.values(wk).forEach(l=>{const mx=Math.max(...l.map(x=>x[1])), mn=Math.min(...l.map(x=>x[1])); l.forEach(([o,s])=>{if(s===mx) hi[y][o]++; if(s===mn) lo[y][o]++;});});});
  const tH=i=>yrs.reduce((s,y)=>s+hi[y][i],0), tL=i=>yrs.reduce((s,y)=>s+lo[y][i],0);
  const ord=O.map((_,i)=>i).sort((a,b)=>tH(b)-tH(a));
  const mx=Math.max(...yrs.flatMap(y=>hi[y]));
  const last=DONE.slice().reverse().map(y=>{const r=E.S[y].find(r=>r[7]===12); return `<tr><td class="l num"><b>${y}</b></td><td class="l">${olink(r[0])}</td><td class="num">${rec(r[1],r[2],r[3])}</td><td class="num">${fmt(r[4])}</td></tr>`});
  return `<div class="block">${head('Weekly high scores','How many times each owner had the top score of the week. Regular season only.')}<div class="tblwrap"><table id="tWH" class="short"><thead><tr><th class="l sort">Owner</th>${yrs.map(y=>`<th class="sort">${y==CUR?yy(y)+'*':yy(y)}</th>`).join('')}<th class="sort">Total</th><th class="sort">Weekly lows</th></tr></thead><tbody>
    ${ord.map(i=>`<tr><td class="l">${olink(i)}</td>${yrs.map(y=>`<td class="num" ${seq(hi[y][i],mx)}>${hi[y][i]||'·'}</td>`).join('')}<td class="num"><b>${tH(i)}</b></td><td class="num">${tL(i)}</td></tr>`).join('')}
   </tbody></table></div><p class="note">* ${CUR} through Week 7. Weekly lows = times with the lowest score of the week.</p></div>
   <div class="block" style="max-width:640px">${head('Last place, every season','The 12th seed at the end of the regular season.')}<div class="tblwrap"><table class="short"><thead><tr><th class="l">Year</th><th class="l">Owner</th><th>Record</th><th>Points for</th></tr></thead><tbody>${last.join('')}</tbody></table></div></div>`;
}
function records2(){ return records().replace(/<\/section>\s*$/, `<div><h2 class="sub-h2">Weekly Honors</h2></div>${weeklyHonors()}</section>`); }


function about(){ return `<section class="view"><div><h2>How It Works</h2></div><div class="block" style="max-width:82ch"><ul style="margin:0;padding-left:20px;display:grid;gap:10px">
  <li><b>Source.</b> Standings, every matchup, drafts, keepers, weekly rosters and player scoring come from the league's own ESPN history for each season since ${DONE[0]}. 2013–14 exist on ESPN but aren't included.</li>
  <li><b>Owners, not team names.</b> Stats follow each person across team-name changes. Names are shown as each owner entered them on ESPN; where space is tight, the ESPN last name is used. Mike Stone and Kevin Haworth are one franchise.</li>
  <li><b>Draft slots.</b> From the "Draft Position" tab of the league workbook, checked against ESPN's round-1 picks (two typos fixed: 2018 Dillon McConvey picked 7th, 2021 Mike Goodwin picked 1st). Expected finish = the average regular-season finish from each slot, ${DONE[0]}–${DONE.at(-1)}.</li>
  <li><b>Draft boards.</b> Every pick colored by where the player finished at his position that season: elite (top 6 RB/WR, top 3 at other spots), starter (top 24 / top 12), depth, or bust.</li>
  <li><b>Keepers.</b> ESPN flagged keepers in 2015 and 2022–${CUR}. For 2016–21 a keeper is a player the same owner drafted in the same round the year before. Owners with two matches are marked; only one of them was the keeper.</li>
  <li><b>Positional rankings and league winners.</b> Every player's full-season fantasy points in the league's scoring that year (standard in 2015, half-PPR after). WAR = points over a replacement-level starter, converted to wins using how much weekly scores swing in this league. Details are on the Players tab.</li>
  <li><b>Trades.</b> Detected from weekly rosters (2018 on): two teams swapping players in both directions in the same week. A trade is scored by what each side's new players scored in that owner's starting lineup for the rest of the season.</li>
  <li><b>Lineups and bench blunders.</b> ESPN keeps weekly player scores from 2018 on. A bench blunder is a loss where the best possible lineup from the same roster would have won.</li>
  <li><b>Head-to-head and rivalries.</b> Regular-season games plus championship-bracket playoff games; consolation games are left out. A 2017 playoff game that ended 129–129 went to Mike Goodwin on the tiebreaker.</li>
  <li><b>All-play and luck.</b> All-play is the record you'd have if you played every team every week. Luck = actual wins minus the wins that all-play rate predicts.</li>
  <li><b>Claude's take.</b> The short owner write-ups are opinions Claude wrote from the numbers on this site.</li>
  <li><b>Colors.</b> Gold = a title or a #1. Green / red = better / worse than normal for that stat.</li>
  <li><b>Freshness.</b> ${CUR} figures are through Week 7.</li>
 </ul></div></section>`; }

/* ================= router v2 ================= */
const VIEWS2=[['home','League'],['owners','Owners'],['h2h','Head-to-Head'],['seasons','Seasons'],['draft','Draft'],['players','Players'],['trades','Trades'],['records','Records'],['about','About']];
$('#tabs').innerHTML=VIEWS2.map(([k,l])=>`<a href="#${k}" data-k="${k}">${l}</a>`).join('');
const go=h=>{history.replaceState(null,'','#'+h); render2();};
function parse(){ let h=decodeURIComponent((location.hash||'#home').slice(1)); const legacy={slots:'draft',positions:'players',winners:'players',management:'owners'}; let [v,p]=h.split('/'); if(legacy[v]) v=legacy[v]; return {v,p}; }
function render2(){
  const {v,p}=parse(); let key=v, html;
  if(/^owner-\d+$/.test(v)){ html=owner(+v.split('-')[1]); key='owners'; }
  else if(/^rivalry-\d+-\d+$/.test(v)){ const [,a,b]=v.split('-').map(Number); html=rivalry(a,b); key='h2h'; }
  else {
    if(v==='seasons'&&p&&E.S[p]) seasonSel=+p;
    if(v==='players'&&p&&E.LW[p]) lwSel=+p;
    if(v==='draft'&&p&&E.DB[p]) boardSel=+p;
    if(v==='trades') trOwner=(p!=null&&p!==''&&O[+p])?+p:-1;
    html=({home,owners:ownersTab,h2h,seasons,draft:draftTab,players,trades,records:records2,about}[v]||home)();
    if(!VIEWS2.some(x=>x[0]===v)) key='home';
  }
  document.body.dataset.view=key;
  $('#app').innerHTML=html;
  document.querySelectorAll('#tabs a').forEach(a=>{const on=a.dataset.k===key; a.setAttribute('aria-current',on?'page':'false'); if(on) a.scrollIntoView({inline:'center',block:'nearest'});});
  document.querySelectorAll('#app table').forEach(t=>{ if(t.querySelector('th.sort')) sortable(t); });
  const on=(sel,fn)=>{const el=$(sel); if(el) el.addEventListener('change',e=>fn(e.target.value));};
  on('#ySel',x=>go('seasons/'+x)); on('#lwSel',x=>go('players/'+x)); on('#bdSel',x=>go('draft/'+x)); on('#trOwn',x=>go('trades/'+(+x<0?'':x)));
  on('#ownSel',x=>{location.hash='owner-'+x}); on('#rvA',x=>{location.hash='rivalry-'+x+'-'+$('#rvB').value}); on('#rvB',x=>{location.hash='rivalry-'+$('#rvA').value+'-'+x});
  document.querySelectorAll('#pm button').forEach(b=>b.addEventListener('click',()=>{pMode=b.dataset.v; render2();}));
  document.querySelectorAll('#pt button').forEach(b=>b.addEventListener('click',()=>{pTier=b.dataset.v; render2();}));
  document.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.more; OPEN.has(k)?OPEN.delete(k):OPEN.add(k); const yv=window.scrollY; render2(); window.scrollTo(0,yv);}));
  document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{const el=document.getElementById(b.dataset.jump); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});}));
}
window.addEventListener('hashchange',()=>{render2(); window.scrollTo(0,0);});
let _rw=window.innerWidth, _rt; window.addEventListener('resize',()=>{clearTimeout(_rt); _rt=setTimeout(()=>{if(Math.abs(window.innerWidth-_rw)>60&&document.querySelector('#app svg.chart')){_rw=window.innerWidth; const yv=window.scrollY; render2(); window.scrollTo(0,yv);}},250);});
render2();

})();
</script>
